spring.application.name=product-service
# SERVER_PORT is set per copy in docker-compose (8100 and 8101). Running
# locally, override it on the command line to start the second copy:
#   mvn spring-boot:run -Dspring-boot.run.arguments=--server.port=8101
server.port=${SERVER_PORT:8100}

# --- Eureka ---
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

# Faster registration so a lab session does not wait a full minute. (Same
# tuning block the course's microservice sample uses.)
eureka.client.registry-fetch-interval-seconds=5
eureka.client.initial-instance-info-replication-interval-seconds=5
eureka.instance.lease-renewal-interval-in-seconds=5
# Two copies on one host must advertise different instance ids, or Eureka
# treats them as the same one. This makes the id include the port.
eureka.instance.instance-id=${spring.application.name}:${server.port}

# --- Database (MySQL with H2 fallback for local dev) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:coffee_shop;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true

# --- SQL Seeding (seed.sql) ---
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:seed.sql
spring.jpa.defer-datasource-initialization=true
