spring.application.name=notification-service
server.port=${SERVER_PORT:8300}

# --- Eureka (register only, to appear on the dashboard) ---
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.lease-renewal-interval-in-seconds=5

# --- Kafka consumer ---
# 9094 from your machine, kafka:9092 from inside Docker (compose sets the env).
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# A brand-new consumer group starts at the EARLIEST event still on the topic,
# not only new ones. Useful when you post orders before this service is up.
spring.kafka.consumer.auto-offset-reset=earliest
# The channel this service listens on. Must match order-service's app.kafka.topic.
app.kafka.topic=orders

# --- Database (MySQL with H2 fallback for local dev) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:coffee_shop;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
