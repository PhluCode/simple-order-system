<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Order Notifications</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ddd; padding: 8px; }
    th { background: #f5f5f5; text-align: left; }
    h1 { margin-bottom: .25rem; }
    .hint { color: #666; }
  </style>
  <script>
    async function load() {
      const res = await fetch('/notifications');
      const data = await res.json();
      const tbody = document.getElementById('tbody');
      tbody.innerHTML = '';
      data.forEach(n => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${n.id ?? ''}</td>`
          + `<td>${n.customerName ?? ''}</td>`
          + `<td>${n.message ?? ''}</td>`;
        tbody.appendChild(tr);
      });
    }
    setInterval(load, 2000);
    window.onload = load;
  </script>
</head>
<body>
  <h1>Order Notifications</h1>
  <p class="hint">This page reloads every 2 seconds. POST an order to order-service and watch a row appear.</p>
  <table>
    <thead><tr><th>ID</th><th>Customer</th><th>Message</th></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
</body>
</html>
