version: '3.8'

# ---------------------------------------------------------------------------
# The whole Simple Order System in one file.
#
#   docker compose up --build      start everything
#   docker compose down            stop everything
#   docker compose down -v         stop and forget the databases + Kafka events
#
# Boot order is handled by healthchecks: kafka waits for zookeeper, the Java
# services wait for eureka, and so on. First boot is slow because Maven builds
# four jars inside Docker - later boots reuse the images.
#
# Ports on your machine:
#   8761  Eureka dashboard        http://localhost:8761
#   8100  product-service copy 1
#   8101  product-service copy 2  (this is how you SEE the load balancer)
#   8200  order-service
#   8300  notification-service    http://localhost:8300  (live page)
#   8400  user-service            (accounts + simple login)
# ---------------------------------------------------------------------------

services:

  zookeeper:
    build: ./zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    networks:
      - order-net
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  kafka:
    build: ./kafka
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9094:9094"
    networks:
      - order-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  eureka-naming-server:
    build:
      context: .
      dockerfile: eureka-naming-server/Dockerfile
    container_name: eureka-naming-server
    ports:
      - "8761:8761"
    networks:
      - order-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  mysql:
    image: mysql:8.0
    container_name: mysql
    command: --default-authentication-plugin=mysql_native_password
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=coffee_shop
    ports:
      - "3307:3306"
    networks:
      - order-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---- product-service: TWO copies, so the load balancer has a choice ----
  product-service-1:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    container_name: product-service-1
    environment:
      - SERVER_PORT=8100
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-naming-server:8761/eureka/
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/coffee_shop?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    ports:
      - "8100:8100"
    networks:
      - order-net
    depends_on:
      eureka-naming-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8100/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  product-service-2:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    container_name: product-service-2
    environment:
      - SERVER_PORT=8101
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-naming-server:8761/eureka/
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/coffee_shop?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    ports:
      - "8101:8101"
    networks:
      - order-net
    depends_on:
      eureka-naming-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8101/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: order-service
    environment:
      - SERVER_PORT=8200
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-naming-server:8761/eureka/
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "8200:8200"
    networks:
      - order-net
    depends_on:
      eureka-naming-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8200/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: user-service
    environment:
      - SERVER_PORT=8400
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-naming-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/coffee_shop?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    ports:
      - "8400:8400"
    networks:
      - order-net
    depends_on:
      eureka-naming-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8400/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: notification-service
    environment:
      - SERVER_PORT=8300
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-naming-server:8761/eureka/
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/coffee_shop?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    ports:
      - "8300:8300"
    networks:
      - order-net
    depends_on:
      eureka-naming-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8300/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

networks:
  order-net:
    driver: bridge
